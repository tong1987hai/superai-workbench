插件 {
    id 'com.android.application'
}

安卓 {
    命名空间 'com.superai.workbench'
    编译SDK 33

    默认配置 {
        应用ID "com.superai.workbench"
        minSdk 24
        目标SDK34
        版本代码 1
        版本名称 "1.0.0"
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        矢量可绘制对象 {
            使用支持库 true
        }
    }

    构建类型 {
        发布 {
            minifyEnabled true
            收缩资源 true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "ALLOW_CLEARTEXT_TRAFFIC", "false"
        }
        调试 {
            buildConfigField "boolean", "ALLOW_CLEARTEXT_TRAFFIC", "true"
        }
    }
    编译选项 {
        sourceCompatibility Java 版本。VERSION_1_8
        目标兼容性 Java 版本。VERSION_1_8
    }
    构建特性 {
        视图绑定 true
        buildConfig true
    }
}

依赖项 {
    实现 'androidx.core:core-ktx:1.12.0'
    实现 'androidx.appcompat:appcompat:1.6.1'
    实现 'com.google.android.material:material:1.11.0'
    实现 'androidx.constraintlayout:constraintlayout:2.1.4'
    实现 'androidx.navigation:navigation-fragment:2.7.6'
    实现 'androidx.navigation:navigation-ui:2.7.6'
    实现 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    实现 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    实现 'com.squareup.retrofit2:retrofit:2.9.0'
    实现 'com.squareup.retrofit2:converter-gson:2.9.0'
    实现 'com.squareup.okhttp3:okhttp:4.12.0'
    实现 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    实现 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    实现 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    实现 'androidx.security:security-crypto:1.1.0-alpha06'
    实现 'androidx.recyclerview:recyclerview:1.3.2'
    实现 'androidx.cardview:cardview:1.0.0'
    实现 'com.guolindev.permissionx:permissionx:1.7.1'
    实现 'com.google.code.gson:gson:2.10.1'
    // 微信支付 SDK
    实现 'com.tencent.mm.opensdk:wechat-sdk-android:+@aar'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
